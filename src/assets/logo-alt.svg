<svg width="240" height="80" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sharp Silver/Chrome Linear Gradient -->
    <linearGradient id="metal-chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#eeeeee" />
      <stop offset="50%" stop-color="#999999" />
      <stop offset="80%" stop-color="#cccccc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Edge Highlight for Beveling -->
    <linearGradient id="bevel-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <!-- High-End 3D Depth Filter -->
    <filter id="bev-3d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur" />
      <feOffset in="blur" dx="2" dy="2" result="offsetBlur" />
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1.5" specularExponent="40" lighting-color="#ffffff" result="spec">
        <fePointLight x="-50" y="-50" z="200" />
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn" />
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="final" />
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#bev-3d)" transform="translate(10, 0)">
    <!-- LEFT CHEVRON < -->
    <path d="M40 25 L15 40 L40 55" fill="none" stroke="url(#metal-chrome)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M40 25 L15 40 L40 55" fill="none" stroke="url(#bevel-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" transform="translate(1,1)" />

    <!-- CENTRAL H -->
    <path d="M60 20 H75 V38 H100 V20 H115 V65 H100 V48 H75 V65 H60 Z" fill="url(#metal-chrome)" />
    <path d="M60 20 H75 V38 H100 V20 H115 V65 H100 V48 H75 V65 H60 Z" fill="url(#bevel-light)" opacity="0.3" />

    <!-- SLASH / -->
    <path d="M140 15 L120 70" fill="none" stroke="url(#metal-chrome)" stroke-width="10" stroke-linecap="round" />
    <path d="M140 15 L120 70" fill="none" stroke="url(#bevel-light)" stroke-width="2" stroke-linecap="round" opacity="0.5" transform="translate(1,1)" />

    <!-- RIGHT CHEVRON > -->
    <path d="M160 25 L185 40 L160 55" fill="none" stroke="url(#metal-chrome)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M160 25 L185 40 L160 55" fill="none" stroke="url(#bevel-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" transform="translate(1,1)" />
  </g>
</svg>
